<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a3a42"/>
      <stop offset="45%" stop-color="#1e1e24"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>
    <radialGradient id="glowA" cx="22%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#5a5a68" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#5a5a68" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="78%" cy="74%" r="60%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="streak" x1="0" y1="1" x2="1" y2="0">
      <stop offset="30%" stop-color="#7a7a8a" stop-opacity="0"/>
      <stop offset="52%" stop-color="#7a7a8a" stop-opacity="0.75"/>
      <stop offset="70%" stop-color="#7a7a8a" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#base)"/>
  <rect width="1600" height="900" fill="url(#glowA)" filter="url(#soft)"/>
  <rect width="1600" height="900" fill="url(#glowB)" filter="url(#soft)"/>
  <rect width="1600" height="900" fill="url(#streak)" filter="url(#soft)" opacity="0.7"/>
</svg>
